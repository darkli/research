tencent:
  type: http
  behavior: classical
  urls:
  # Tencent.yaml currently only contains IP rules; the .list includes domains.
  - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent_Classical_No_Resolve.yaml
    format: clash
  - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TencentVideo/TencentVideo_No_Resolve.yaml
  - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/WeChat/WeChat_No_Resolve.yaml
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/tencent
    format: dlc
    name: tencent
  - url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Tencent.list
    format: classical-text
  # Incremental gaps are relative to upstream domains, never relative to GeoIP.
  additions:
  - rule: DOMAIN-SUFFIX,codebuddy.ai
    evidence: https://cloud.tencent.com/document/product/1823/130068
  - rule: DOMAIN-SUFFIX,codebuddy.cn
    evidence: https://www.codebuddy.cn/
  dns_servers:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  path: ./ruleset/tencent.yaml
  interval: 86400
