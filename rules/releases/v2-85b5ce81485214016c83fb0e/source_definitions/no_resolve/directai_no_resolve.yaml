directai:
  type: http
  behavior: classical
  # Chinese AI products and their domestic endpoints, independent of company.
  # category-ai-!cn and ACL4SSR AI.list describe overseas services.
  urls:
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-ai-cn
    format: dlc
    name: category-ai-cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/aixcoder
    format: dlc
    name: aixcoder
  - url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/aiXcoder/aiXcoder.list
    format: classical-text
  # Reviewed product/API gaps outside the upstream AI category.
  # Keep shared company domains (qq.com, aliyuncs.com, etc.) in their own routes.
  additions:
  - rule: DOMAIN-SUFFIX,workbuddy.ai
    evidence: https://www.workbuddy.ai/document/term
  - rule: DOMAIN-SUFFIX,workbuddy.host
    evidence: https://workbuddy.host/
  - rule: DOMAIN-SUFFIX,workbuddy.link
    evidence: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.list
  - rule: DOMAIN-SUFFIX,codebuddy.ai
    evidence: https://cloud.tencent.com/document/product/1823/130068
  - rule: DOMAIN-SUFFIX,codebuddy.info
    evidence: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent.list
  - rule: DOMAIN-SUFFIX,codebuddy.net
    evidence: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent.list
  - rule: DOMAIN-SUFFIX,codebuddy.pro
    evidence: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent.list
  - rule: DOMAIN-SUFFIX,codebuddy.work
    evidence: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Tencent/Tencent.list
  - rule: DOMAIN-SUFFIX,copilot.tencent.com
    evidence: https://cloud.tencent.com/document/product/1831/134363
  - rule: DOMAIN-SUFFIX,copilot-invite.tencent.com
    evidence: https://cloud.tencent.com/document/product/1831/134363
  - rule: DOMAIN-SUFFIX,copilot.qq.com
