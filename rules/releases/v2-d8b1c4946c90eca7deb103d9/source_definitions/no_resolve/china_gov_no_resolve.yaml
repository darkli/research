china_gov:
  type: http
  behavior: classical
  urls:
  # 政务机关、铁路 12306、CNNIC 与央媒（blackmatrix7 No_Resolve）
  - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GovCN/GovCN_No_Resolve.yaml
  - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/12306/12306_No_Resolve.yaml
  - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/CNNIC/CNNIC_No_Resolve.yaml
  - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaNews/ChinaNews_No_Resolve.yaml
  # 教育考试、科研院所、公立医院、党媒央媒、邮政石化与工商公示查询（v2fly）
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-education-cn
    format: dlc
    name: category-education-cn
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-scholar-cn
    format: dlc
    name: category-scholar-cn
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-hospital-cn
    format: dlc
    name: category-hospital-cn
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-media-cn
    format: dlc
    name: category-media-cn
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-enterprise-query-platform-cn
    format: dlc
    name: category-enterprise-query-platform-cn
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/cctv
    format: dlc
    name: cctv
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/chinanews
    format: dlc
    name: chinanews
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/bjyouth
    format: dlc
    name: bjyouth
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/chinapost
    format: dlc
    name: chinapost
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/petrochina
    format: dlc
    name: petrochina
    filters:
    - -!cn
  - url: https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/sinopec
    format: dlc
    name: sinopec
    filters:
    - -!cn
  # 央视总台（ACL4SSR）
  - url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/CCTV.list
    format: classical-text
